name: probe (temporary)

on:
  push:
    paths:
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Version lists
        run: |
          tailv() { curl -fsSL "$1" | grep -o "<version>[^<]*" | sed 's/<version>//' | grep -vE "alpha|beta|rc|RC|Beta|dev|-M[0-9]|SNAPSHOT" | tail -${2:-14} | tr '\n' ' '; }
          K=$(tailv https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml 14)
          S=$(tailv https://repo.maven.apache.org/maven2/com/google/devtools/ksp/symbol-processing-gradle-plugin/maven-metadata.xml 20)
          R=$(tailv https://dl.google.com/android/maven2/androidx/room/room-runtime/maven-metadata.xml 8)
          A=$(tailv https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml 10)
          echo "::notice title=PROBE kotlin::$K"
          echo "::notice title=PROBE ksp::$S"
          echo "::notice title=PROBE room::$R"
          echo "::notice title=PROBE agp::$A"
      - name: Build with litertlm 0.10.2 to read metadata line
        continue-on-error: true
        run: |
          sed -i 's|version = "latest.release"|version = "0.10.2"|' gradle/libs.versions.toml
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/b.log || true
          L=$(grep "incompatible version of Kotlin" /tmp/b.log | head -3 | sed -E 's#file:///[^ ]*/##' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=PROBE metadata::${L}"
